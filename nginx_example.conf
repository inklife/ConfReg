server {
    listen 80;
    server_name reg.sqiao.top;
    
    # ACME 验证路径
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reg;
        allow all;
    }

    # 重定向到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name reg.sqiao.top;

    ssl_certificate     /etc/ssl/certs/reg.sqiao.top.crt;
    ssl_certificate_key /etc/ssl/private/reg.sqiao.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1h;

    # 设置默认字符编码
    charset utf-8;

    # 设置客户端请求体最大大小为 11MB
    client_max_body_size 11M;

    access_log /var/log/nginx/reg.access.log main;
    error_log  /var/log/nginx/reg.error.log warn;

    # API 接口转发到 Node.js 服务
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin 静态文件优先处理
    location ^~ /admin {
        alias /root/ConfReg/server/public/admin;
        expires 7d;
        add_header Cache-Control "public";
        
        # 为JavaScript和CSS文件设置正确的Content-Type和编码
        location ~* \.js$ {
            add_header Content-Type "application/javascript; charset=utf-8";
            expires 7d;
            add_header Cache-Control "public";
        }
        
        location ~* \.css$ {
            add_header Content-Type "text/css; charset=utf-8";
            expires 7d;
            add_header Cache-Control "public";
        }
        
        try_files $uri $uri/ @admin_proxy;
    }

    # Admin API 代理
    location @admin_proxy {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Node.js 服务器静态文件 - public 目录
    location ^~ /public {
        alias /root/ConfReg/server/public;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # Node.js 服务器静态文件 - uploads 目录（使用^~确保优先级）
    location ^~ /uploads {
        alias /root/ConfReg/server/uploads;
        expires 24h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vue.js 前端静态资源 - JavaScript文件
    location ~* \.js$ {
        root /root/ConfReg/frontend/dist;
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vue.js 前端静态资源 - CSS文件
    location ~* \.css$ {
        root /root/ConfReg/frontend/dist;
        add_header Content-Type "text/css; charset=utf-8";
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 图片等媒体文件（只匹配前端dist目录的图片）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        root /root/ConfReg/frontend/dist;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 字体文件
    location ~* \.(woff|woff2|ttf|eot)$ {
        root /root/ConfReg/frontend/dist;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vue.js 前端路由 - SPA fallback
    location / {
        root /root/ConfReg/frontend/dist;
        index index.html;
        
        # index.html 设置短期缓存和编码
        location = /index.html {
            add_header Content-Type "text/html; charset=utf-8";
            expires 1h;
            add_header Cache-Control "public";
        }
        
        try_files $uri $uri/ @fallback;
    }

    # SPA fallback 处理
    location @fallback {
        root /root/ConfReg/frontend/dist;
        add_header Content-Type "text/html; charset=utf-8";
        expires 1h;
        add_header Cache-Control "public";
        rewrite ^.*$ /index.html last;
    }

    # 特殊处理 conference 路由
    location /conference {
        root /root/ConfReg/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
