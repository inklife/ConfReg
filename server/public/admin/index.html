<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration System</title>
    <!-- TODO: 会议名称应从环境变量读取 -->
    <link href="https://s4.zstatic.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            margin: 2rem;
        }
        
        .logo {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .description {
            font-size: 1rem;
            color: #777;
            margin-bottom: 3rem;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            min-width: 180px;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .features {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .feature {
            background: rgba(102, 126, 234, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
        }
        
        .feature i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .feature h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .feature p {
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-calendar-alt"></i>
        </div>
        
        <p class="subtitle">Conference Registration System</p>
        
        <p class="description">
            欢迎使用 会议注册系统。本系统提供完整的会议注册管理功能，
            包括用户注册、注册审核、支付管理等。
        </p>
        
        <div class="buttons">
            <a href="login.html" class="btn btn-primary">
                <i class="fas fa-user-shield"></i>
                管理员登录
            </a>
            <a href="#" class="btn btn-secondary" id="user-portal-btn">
                <i class="fas fa-user"></i>
                用户注册
            </a>
        </div>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-users"></i>
                <h3>用户管理</h3>
                <p>完整的用户注册和管理功能</p>
            </div>
            
            <div class="feature">
                <i class="fas fa-file-alt"></i>
                <h3>注册审核</h3>
                <p>高效的注册申请审核流程</p>
            </div>
            
            <div class="feature">
                <i class="fas fa-chart-bar"></i>
                <h3>数据统计</h3>
                <p>详细的注册和收入统计报告</p>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
