<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - Conference Registration</title>
    <!-- TODO: 会议名称应从环境变量读取 -->
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-shield-alt"></i>
                <h1>管理员登录</h1>
                <p>Conference Registration Management System</p>
                <!-- TODO: 会议名称应从环境变量读取 -->
            </div>
            
            <form class="login-form" id="login-form" method="post" action="javascript:void(0);">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        用户名
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="请输入用户名"
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        密码
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="请输入密码"
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="toggle-password-btn">
                            <i class="fas fa-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group remember">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        记住我
                    </label>
                    <a href="/forgot-password" id="forgot-password-link" class="forgot-password-link">忘记密码？</a>
                </div>
                
                <button type="submit" class="login-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    登录
                </button>
            </form>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>
        </div>
        
        <!-- 忘记密码模态框 -->
        <div id="forgot-password-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Reset Password</h3>
                    <span class="close" id="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <p>Enter your email address and we'll send you a reset email with both a security code and a reset link.</p>
                    <form id="email-reset-form">
                        <div class="form-group">
                            <label for="reset-email">Email Address</label>
                            <input type="email" id="reset-email" required placeholder="Enter your email address">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Send Reset Email</button>
                            <button type="button" class="btn-secondary" onclick="hideForgotPasswordModal()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="login-footer">
            <p>© 2025 ICPADS Conference. All rights reserved.</p>
            </div>
        </div>
        
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
